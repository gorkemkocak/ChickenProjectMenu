<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>QR Menü</title>
  <!-- Bu dosya src/admin/static/menu-view.html temel alınarak oluşturuldu.
       Tek fark: veri kaynağı olarak ./menu-data.json kullanıyor. -->
  <style>
    :root {
      --bg: #020617;
      --panel: #020617;
      --accent: #ef4444;
      --accent-soft: #b91c1c;
      --card: #111827;
      --card-soft: #030712;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --pill-bg: #020617;
      --pill-border: #f97316;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .shell {
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 14px 16px 10px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .back-btn.visible {
      visibility: visible;
      opacity: 1;
    }

    .back-btn span {
      border: solid #e5e7eb;
      border-width: 0 2px 2px 0;
      display: inline-block;
      padding: 3px;
      transform: rotate(135deg);
    }

    .header-main {
      min-width: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 11px;
      opacity: 0.9;
    }

    .tabs-wrapper {
      background: #000;
      padding: 6px 8px 4px;
      overflow-x: auto;
      position: sticky;
      top: 0;
      z-index: 5;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .tabs-wrapper::-webkit-scrollbar {
      display: none;
    }

    .tabs {
      display: inline-flex;
      gap: 6px;
      padding-bottom: 4px;
    }

    .tab-pill {
      border-radius: var(--radius-pill);
      padding: 6px 11px;
      font-size: 11px;
      border: 1px solid rgba(248, 113, 113, 0.6);
      background: var(--pill-bg);
      color: #fef2f2;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }

    .scroll-area {
      flex: 1 1 auto;
      overflow-y: auto;
      background: #000;
      padding: 10px 10px 80px;
    }

    .hero-image {
      border-radius: 18px;
      overflow: hidden;
      background: #111827;
      margin-bottom: 12px;
    }

    .hero-image img {
      width: 100%;
      display: block;
      height: 190px;
      object-fit: cover;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      margin: 4px 2px 8px;
    }

    .item-card {
      background: var(--card);
      border-radius: 18px;
      padding: 8px 8px 8px 8px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      cursor: pointer;
    }

    .item-thumb {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      overflow: hidden;
      background: #0b1120;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .item-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .item-main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      padding-right: 4px;
    }

    .item-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-price {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      margin-left: 6px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .item-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .detail-hero {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      display: block;
    }

    .detail-card {
      margin-top: 10px;
      border-radius: 20px;
      background: #020617;
      padding: 18px 18px 26px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.65);
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .detail-name {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
      word-break: break-word;
    }

    .detail-price {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 6px;
    }

    .detail-desc {
      font-size: 14px;
      line-height: 1.6;
      color: #e5e7eb;
      margin-top: 6px;
      word-break: break-word;
    }

    .fab {
      position: fixed;
      bottom: 22px;
      right: 18px;
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 18px 40px rgba(239, 68, 68, 0.6);
      color: #fff;
      cursor: pointer;
      z-index: 10;
    }

    .fab-arrow {
      border: solid #fff;
      border-width: 0 2px 2px 0;
      display: inline-block;
      padding: 4px;
      transform: rotate(-135deg);
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="back-btn" id="backBtn">
        <span></span>
      </div>
      <div class="header-main">
        <div class="brand-title" id="brandTitle">Menü</div>
        <div class="brand-sub" id="brandSub">QR Menü Görünümü</div>
      </div>
    </header>

    <div class="tabs-wrapper">
      <div class="tabs" id="tabBar"></div>
    </div>

    <main class="scroll-area" id="scrollArea"></main>
  </div>

  <div class="fab" id="scrollTopFab">
    <span class="fab-arrow"></span>
  </div>

  <script>
    const state = {
      menu: [],
      activeView: "main",
      activeCategoryId: "",
      activeItem: null
    };

    const els = {
      tabWrapper: document.querySelector(".tabs-wrapper"),
      tabBar: document.getElementById("tabBar"),
      scrollArea: document.getElementById("scrollArea"),
      brandTitle: document.getElementById("brandTitle"),
      brandSub: document.getElementById("brandSub"),
      backBtn: document.getElementById("backBtn"),
      fab: document.getElementById("scrollTopFab")
    };

    function computeImageSrc(imageUrl) {
      if (!imageUrl) return "";
      // /menu-images/... -> ./menu-images/... şeklinde kullan
      if (imageUrl.startsWith("/")) {
        return "." + imageUrl;
      }
      return imageUrl;
    }

    async function loadMenu() {
      // Burada backend yerine docs/menu-data.json okunuyor
      const res = await fetch("./menu-data.json");
      const data = await res.json();
      const menu = Array.isArray(data.menu) ? data.menu : [];
      state.menu = menu;
      if (menu.length > 0) {
        state.activeCategoryId = menu[0].id;
        els.brandTitle.textContent = "Chicken Project";
        els.brandSub.textContent = "QR Menü";
      }
      renderView();
    }

    function renderTabs() {
      els.tabBar.innerHTML = "";
      for (const cat of state.menu) {
        const btn = document.createElement("button");
        btn.className =
          "tab-pill" +
          (cat.id === state.activeCategoryId && state.activeView === "main" ? " active" : "");
        btn.textContent = cat.name || "Kategori";
        btn.addEventListener("click", () => {
          state.activeView = "main";
          state.activeCategoryId = cat.id;
          renderView();
          const hero = document.querySelector(`[data-cat-hero=\"${cat.id}\"]`);
          if (hero) {
            hero.scrollIntoView({ behavior: "smooth", block: "start" });
          } else {
            els.scrollArea.scrollTo({ top: 0, behavior: "smooth" });
          }
        });
        els.tabBar.appendChild(btn);
      }
    }

    function renderView() {
      if (state.activeView === "detail") {
        els.backBtn.classList.add("visible");
      } else {
        els.backBtn.classList.remove("visible");
      }

      if (state.activeView === "detail") {
        renderDetailView();
      } else {
        renderMainView();
      }
      renderTabs();
    }

    function renderMainView() {
      els.scrollArea.innerHTML = "";
      for (const cat of state.menu) {
        const wrapper = document.createElement("section");
        wrapper.style.marginBottom = "18px";
        wrapper.dataset.catHero = cat.id;

        if (cat.coverImageUrl) {
          const hero = document.createElement("div");
          hero.className = "hero-image";
          const img = document.createElement("img");
          img.src = computeImageSrc(cat.coverImageUrl);
          img.alt = cat.name || "";
          hero.appendChild(img);
          wrapper.appendChild(hero);
        }

        const title = document.createElement("div");
        title.className = "section-title";
        title.textContent = cat.name || "";
        wrapper.appendChild(title);

        const items = Array.isArray(cat.items) ? cat.items : [];
        for (const item of items) {
          const card = document.createElement("div");
          card.className = "item-card";
          card.addEventListener("click", () => openDetail(cat, item));

          const thumb = document.createElement("div");
          thumb.className = "item-thumb";
          if (item.imageUrl) {
            const img = document.createElement("img");
            img.src = computeImageSrc(item.imageUrl);
            img.alt = item.name || "";
            thumb.appendChild(img);
          } else {
            thumb.textContent = "Foto";
          }

          const main = document.createElement("div");
          main.className = "item-main";
          const row = document.createElement("div");
          row.className = "item-row";
          const name = document.createElement("div");
          name.className = "item-name";
          name.textContent = item.name || "";
          const price = document.createElement("div");
          price.className = "item-price";
          const priceVal =
            typeof item.price === "number" ? item.price.toFixed(0) : item.price;
          price.textContent = `${priceVal} TL`;
          row.appendChild(name);
          row.appendChild(price);

          const desc = document.createElement("div");
          desc.className = "item-desc";
          desc.textContent = item.description || "";

          main.appendChild(row);
          if (item.description) main.appendChild(desc);

          card.appendChild(thumb);
          card.appendChild(main);
          wrapper.appendChild(card);
        }

        els.scrollArea.appendChild(wrapper);
      }
    }

    function renderDetailView() {
      const item = state.activeItem;
      if (!item) {
        state.activeView = "main";
        renderMainView();
        return;
      }
      els.scrollArea.innerHTML = "";

      if (item.imageUrl) {
        const img = document.createElement("img");
        img.className = "detail-hero";
        img.src = computeImageSrc(item.imageUrl);
        img.alt = item.name || "";
        els.scrollArea.appendChild(img);
      }

      const card = document.createElement("div");
      card.className = "detail-card";
      const header = document.createElement("div");
      header.className = "detail-header";
      const name = document.createElement("div");
      name.className = "detail-name";
      name.textContent = item.name || "";
      const price = document.createElement("div");
      price.className = "detail-price";
      const priceVal =
        typeof item.price === "number" ? item.price.toFixed(0) : item.price;
      price.textContent = `${priceVal} TL`;
      header.appendChild(name);
      header.appendChild(price);

      const desc = document.createElement("div");
      desc.className = "detail-desc";
      desc.textContent = item.description || "";

      card.appendChild(header);
      card.appendChild(desc);
      els.scrollArea.appendChild(card);
    }

    function openDetail(category, item) {
      state.activeView = "detail";
      state.activeCategoryId = category.id;
      state.activeItem = item;
      renderView();
    }

    els.backBtn.addEventListener("click", () => {
      if (state.activeView === "detail") {
        state.activeView = "main";
        state.activeItem = null;
        renderView();
        const hero = document.querySelector(
          `[data-cat-hero=\"${state.activeCategoryId}\"]`
        );
        if (hero) {
          hero.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }
    });

    els.fab.addEventListener("click", () => {
      els.scrollArea.scrollTo({ top: 0, behavior: "smooth" });
    });

    (function setupTabDragScroll() {
      if (!els.tabWrapper) return;
      let isDown = false;
      let startX = 0;
      let scrollStart = 0;

      const onDown = (event) => {
        isDown = true;
        startX = event.clientX;
        scrollStart = els.tabWrapper.scrollLeft;
      };

      const onMove = (event) => {
        if (!isDown) return;
        const dx = event.clientX - startX;
        els.tabWrapper.scrollLeft = scrollStart - dx;
      };

      const onUp = () => {
        isDown = false;
      };

      els.tabWrapper.addEventListener("mousedown", onDown);
      window.addEventListener("mousemove", onMove);
      window.addEventListener("mouseup", onUp);
      els.tabWrapper.addEventListener("mouseleave", onUp);
    })();

    loadMenu();
  </script>
</body>
</html>
